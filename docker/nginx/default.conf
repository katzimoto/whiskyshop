server {
    listen 80;
    server_name _;
    root /var/www/html;
    index index.php;

    client_max_body_size 32m;

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param SCRIPT_NAME $fastcgi_script_name;
        fastcgi_pass wordpress:9000;
    }

    location ~ /\. {
        deny all;
    }

    # WooCommerce and omef-core write files here that must never be directly
    # web-fetchable (DB backups, payment/order debug logs, protected digital
    # downloads). Each ships an .htaccess "deny from all", but that's an
    # Apache-only mechanism this nginx config never reads, so it was silently
    # doing nothing -- confirmed by fetching a real backup over HTTP. Backups
    # are already served safely through an authenticated admin-post action
    # (see omef_backup_download_action in omef-core); direct access is never
    # needed by legitimate code.
    location ~ ^/wp-content/uploads/(wc-logs|omef-backups|woocommerce_uploads)/ {
        deny all;
    }
}
