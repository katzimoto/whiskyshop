services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${WORDPRESS_PORT:-8080}:80"
    volumes:
      - wordpress:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./wp-content/themes/omef:/var/www/html/wp-content/themes/omef:ro
      - ./wp-content/plugins/omef-core:/var/www/html/wp-content/plugins/omef-core:ro
      - ./wp-content/uploads:/var/www/html/wp-content/uploads:ro
    depends_on:
      wordpress:
        condition: service_started
    restart: unless-stopped

  wordpress:
    build:
      context: ./docker/wordpress
    environment:
      WORDPRESS_DB_HOST: database:3306
      WORDPRESS_DB_NAME: ${DB_NAME}
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_FROM: ${SMTP_FROM:-noreply@omef.test}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      WORDPRESS_DEBUG: ${WORDPRESS_DEBUG:-}
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_HOME', '${WP_HOME}');
        define('WP_SITEURL', '${WP_SITEURL}');
        define('WP_DEBUG_LOG', ${WP_DEBUG_LOG:-false});
        define('WP_DEBUG_DISPLAY', ${WP_DEBUG_DISPLAY:-false});
        define('WP_ENVIRONMENT_TYPE', '${WP_ENVIRONMENT_TYPE:-production}');
        define('DISALLOW_FILE_EDIT', ${DISALLOW_FILE_EDIT:-true});
        define('WP_REDIS_HOST', 'redis');
        define('WP_REDIS_PORT', 6379);
    volumes:
      - wordpress:/var/www/html
      - ./wp-content/themes/omef:/var/www/html/wp-content/themes/omef
      - ./wp-content/plugins/omef-core:/var/www/html/wp-content/plugins/omef-core
      - ./wp-content/uploads:/var/www/html/wp-content/uploads
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis:/data
    restart: unless-stopped

  database:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - database:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.27.4
    ports:
      - "8025:8025"
    restart: unless-stopped

volumes:
  database:
  redis:
  wordpress:
