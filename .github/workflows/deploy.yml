name: Deploy to VPS

# Fires once the CI workflow (lint + PHPUnit) finishes on main — i.e. after a
# PR merges — rather than on every push directly, so a red CI run never
# reaches the VPS. workflow_run's branch filter only matches runs whose
# workflow executed against main, which excludes CI runs triggered by
# pull_request (those run against the PR's head branch), so this only fires
# for genuine pushes to main.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vps-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Redeploy site on VPS
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || 'main' }}

      - name: Install rsync
        run: sudo apt-get update && sudo apt-get install -y rsync

      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: ${{ secrets.SSH_KNOWN_HOSTS }}
          if_key_exists: fail

      - name: Sync omef-core plugin
        run: |
          rsync -az --checksum --delete --rsync-path="sudo rsync" \
            -e "ssh -p '${{ secrets.SSH_PORT || '22' }}' -o StrictHostKeyChecking=accept-new" \
            ./wp-content/plugins/omef-core/ \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/wp-content/plugins/omef-core/"

      - name: Sync omef theme
        run: |
          rsync -az --checksum --delete --rsync-path="sudo rsync" \
            -e "ssh -p '${{ secrets.SSH_PORT || '22' }}' -o StrictHostKeyChecking=accept-new" \
            ./wp-content/themes/omef/ \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/wp-content/themes/omef/"

      - name: Sync mu-plugins
        run: |
          rsync -az --checksum --delete --rsync-path="sudo rsync" \
            -e "ssh -p '${{ secrets.SSH_PORT || '22' }}' -o StrictHostKeyChecking=accept-new" \
            ./wp-content/mu-plugins/ \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/wp-content/mu-plugins/"

      - name: Sync stack definition
        run: |
          rsync -az --checksum --mkpath \
            -e "ssh -p '${{ secrets.SSH_PORT || '22' }}' -o StrictHostKeyChecking=accept-new" \
            ./docker/ \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/docker/"
          rsync -az --checksum \
            -e "ssh -p '${{ secrets.SSH_PORT || '22' }}' -o StrictHostKeyChecking=accept-new" \
            ./docker-compose.yml \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/docker-compose.yml"

      - name: Reload the running site
        env:
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          REMOTE_CMD: ${{ secrets.DEPLOY_REMOTE_CMD }}
        run: |
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "cd '$DEPLOY_PATH' && docker compose up -d --build --no-deps && docker compose restart wordpress nginx"

      - name: Provision store (WooCommerce + content cleanup)
        env:
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "cd '$DEPLOY_PATH' && bash -s" <<'REMOTE'
          set -e
          # docker compose exec inherits stdin by default; since this whole
          # script arrives over one SSH/stdin stream, the first exec call
          # would otherwise drain the rest of the heredoc as its own input
          # and silently truncate everything after it. Always give it /dev/null.
          WP() { docker compose exec -T wordpress wp --allow-root "$@" < /dev/null; }

          echo "== WooCommerce =="
          WP plugin is-installed woocommerce || WP plugin install woocommerce --version=11.0.0
          WP plugin is-active woocommerce || WP plugin activate woocommerce

          echo "== payment gateways (temporary mock card until a real processor is wired up) =="
          WP option update woocommerce_bacs_settings --format=json '{"enabled":"no"}'
          WP option update woocommerce_cod_settings --format=json '{"enabled":"no"}'
          WP option update woocommerce_omef_mock_card_settings --format=json '{"enabled":"yes","title":"כרטיס אשראי","description":"התשלום מאובטח ומעובד בעת אישור ההזמנה."}'

          echo "== remove default junk content =="
          while read -r id; do
            [ -n "$id" ] && WP post delete "$id" --force || true
          done < <(WP post list --post_type=any --name=hello-world --field=ID --format=csv)
          while read -r id; do
            [ -n "$id" ] && WP post delete "$id" --force || true
          done < <(WP post list --post_type=post,page --name=sample-page --field=ID --format=csv)

          echo "== seed content from fixtures =="
          docker compose exec -T wordpress php -l wp-content/plugins/omef-core/fixtures/provision-seed.php < /dev/null
          WP eval-file wp-content/plugins/omef-core/fixtures/provision-seed.php

          echo "== refresh =="
          WP rewrite flush
          WP cache flush
          REMOTE
          if [ -n "$REMOTE_CMD" ]; then
            ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "$REMOTE_CMD"
          fi

      - name: Smoke test the deployed site
        env:
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "cd '$DEPLOY_PATH' && bash -s" <<'REMOTE'
          set -e
          PORT="$(grep -m1 '^WORDPRESS_PORT=' .env 2>/dev/null | cut -d= -f2)"
          PORT="${PORT:-8080}"

          for attempt in 1 2 3 4 5; do
            status=$(curl -s -o /tmp/omef-smoke.html -w '%{http_code}' "http://localhost:${PORT}/" || echo "000")
            if [ "$status" = "200" ] && ! grep -qi "there has been a critical error\|error establishing a database connection" /tmp/omef-smoke.html; then
              echo "Smoke test passed (HTTP $status)."
              rm -f /tmp/omef-smoke.html
              exit 0
            fi
            echo "Smoke test attempt $attempt got HTTP $status, retrying..."
            sleep 5
          done

          echo "Smoke test failed: the homepage did not come back healthy after this deploy."
          cat /tmp/omef-smoke.html
          exit 1
          REMOTE