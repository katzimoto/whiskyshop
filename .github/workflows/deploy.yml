name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vps-deploy
  cancel-in-progress: true

jobs:
  lint:
    name: PHP syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PHP
        run: sudo apt-get update && sudo apt-get install -y php-cli
      - name: Lint custom plugin and theme
        run: |
          find wp-content/plugins/omef-core wp-content/themes/omef -name '*.php' -print0 | xargs -0 -n1 php -l || exit 1

  deploy:
    name: Redeploy site on VPS
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install rsync
        run: sudo apt-get update && sudo apt-get install -y rsync

      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: ${{ secrets.SSH_KNOWN_HOSTS }}
          if_key_exists: fail

      - name: Sync omef-core plugin
        run: |
          rsync -az --checksum --delete --rsync-path="sudo rsync" \
            -e "ssh -p '${{ secrets.SSH_PORT || '22' }}' -o StrictHostKeyChecking=accept-new" \
            ./wp-content/plugins/omef-core/ \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/wp-content/plugins/omef-core/"

      - name: Sync omef theme
        run: |
          rsync -az --checksum --delete --rsync-path="sudo rsync" \
            -e "ssh -p '${{ secrets.SSH_PORT || '22' }}' -o StrictHostKeyChecking=accept-new" \
            ./wp-content/themes/omef/ \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/wp-content/themes/omef/"

      - name: Sync stack definition
        run: |
          rsync -az --checksum --mkpath \
            -e "ssh -p '${{ secrets.SSH_PORT || '22' }}' -o StrictHostKeyChecking=accept-new" \
            ./docker/ \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/docker/"
          rsync -az --checksum \
            -e "ssh -p '${{ secrets.SSH_PORT || '22' }}' -o StrictHostKeyChecking=accept-new" \
            ./docker-compose.yml \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/docker-compose.yml"

      - name: Reload the running site
        env:
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          REMOTE_CMD: ${{ secrets.DEPLOY_REMOTE_CMD }}
        run: |
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "cd '$DEPLOY_PATH' && docker compose up -d --build --no-deps && docker compose restart wordpress nginx"

      - name: Provision store (WooCommerce + content cleanup)
        env:
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "cd '$DEPLOY_PATH' && bash -s" <<'REMOTE'
          set -e
          WP() { docker compose exec -T wordpress wp --allow-root "$@"; }

          echo "== WooCommerce =="
          WP plugin is-installed woocommerce || WP plugin install woocommerce --version=11.0.0
          WP plugin is-active woocommerce || WP plugin activate woocommerce

          echo "== payment gateways (temporary mock card until a real processor is wired up) =="
          WP option update woocommerce_bacs_settings --format=json '{"enabled":"no"}'
          WP option update woocommerce_cod_settings --format=json '{"enabled":"no"}'
          WP option update woocommerce_omef_mock_card_settings --format=json '{"enabled":"yes","title":"כרטיס אשראי","description":"התשלום מאובטח ומעובד בעת אישור ההזמנה."}'

          echo "== remove default junk content =="
          while read -r id; do
            [ -n "$id" ] && WP post delete "$id" --force || true
          done < <(WP post list --post_type=any --name=hello-world --field=ID --format=csv)
          while read -r id; do
            [ -n "$id" ] && WP post delete "$id" --force || true
          done < <(WP post list --post_type=post,page --name=sample-page --field=ID --format=csv)

          echo "== seed content from fixtures =="
          docker compose exec -T wordpress php -l wp-content/plugins/omef-core/fixtures/provision-seed.php
          WP eval-file wp-content/plugins/omef-core/fixtures/provision-seed.php

          echo "== refresh =="
          WP rewrite flush
          WP cache flush
          REMOTE
          if [ -n "$REMOTE_CMD" ]; then
            ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "$REMOTE_CMD"
          fi